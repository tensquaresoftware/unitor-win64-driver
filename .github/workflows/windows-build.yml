# Windows build + quality merge gate.
#
# Inspired by Matrix-Control patterns (quality-gate, ci-success, checkout@v5) —
# adapted to Windows-only usermode Bridge (no multi-OS matrix, no draft tier, no release).

name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install quality-gate dependencies
        run: python3 -m pip install -r scripts/quality/requirements.txt

      - name: Lint touched C++ (quality gate)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}"
            python3 scripts/quality/lint-touched.py --base "$BASE_REF"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse --verify "$BEFORE" >/dev/null 2>&1; then
              python3 scripts/quality/lint-touched.py --base "$BEFORE"
            else
              python3 scripts/quality/lint-touched.py --base "HEAD~1"
            fi
          fi

  build:
    name: build
    needs: [quality-gate]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version
          Write-Host "=== Visual Studio (vswhere) ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property displayName,installationVersion,installationPath

      - name: Configure (builds/)
        run: cmake -S . -B builds/ci -A x64

      - name: Build
        run: cmake --build builds/ci --config Release

      - name: Confirm Bridge artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path builds/ci -Recurse -Filter Bridge.exe -ErrorAction Stop |
            Select-Object -First 1
          if (-not $exe) { throw "Bridge.exe not found under builds/ci" }
          Write-Host "Built: $($exe.FullName)"

      - name: Run BridgeTests
        run: ctest --test-dir builds/ci -C Release --output-on-failure

  ci-success:
    name: ci-success
    needs: [quality-gate, build]
    if: >-
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI legs passed
        run: echo "quality-gate, build, and BridgeTests passed; merge gate green."
